# golangci-lint v2 configuration, run per module by `mise run check`: the standard set plus
# depguard, testpackage, and nolintlint, one depguard rule per module.
# See architecture/standards/go-elemental/principles/dependencies.md
# See architecture/standards/go-elemental/principles/tests-and-docs.md
# See architecture/principles/comments.md
# See docs/design.md, "The lint configuration"
version: "2"

run:
  tests: true

linters:
  default: standard
  enable:
    - depguard
    - nolintlint
    - testpackage
  settings:
    nolintlint:
      require-explanation: true
      require-specific: true
    testpackage:
      skip-regexp: export_test\.go
      allow-packages: [""]
    depguard:
      rules:
        base:
          list-mode: strict
          files:
            - "**/*.go"
            - "!**/tools/infer/**"
          allow:
            - $gostd
            - github.com/standards-lab/go-ai$
            - github.com/standards-lab/go-ai/
        infer:
          list-mode: strict
          files:
            - "**/tools/infer/**"
          allow:
            - $gostd
            - github.com/standards-lab/go-ai$
            - github.com/standards-lab/go-ai/
            - github.com/standards-lab/go-cli-sdk$
            - github.com/standards-lab/go-cli-sdk/
            - github.com/standards-lab/go-core$
            - github.com/standards-lab/go-core/
          deny:
            - pkg: github.com/standards-lab/go-ai/internal
              desc: infer builds on go-ai's public packages only; its tests use go-ai's public aitest
