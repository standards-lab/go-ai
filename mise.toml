[tools]
go = "1.27.4"
golangci-lint = "2.15.0"
jq = "1.8.2"

# Space-separated list of module directories. "." is the base module and
# tools/infer the CLI's; each is added as the library and infer tasks build it.
[env]
GO_MODULES = ". tools/infer"

[tasks.check]
description = "Build, vet, format, fix, tidy, test, and lint every module; writes nothing"
run = '''
set -eu
export GOWORK=off
# The base module requires nothing: its line is the standard library alone, which depguard holds
# each import to and this states of go.mod itself.
cd "$MISE_PROJECT_ROOT"
if ! go mod edit -json | jq -e '(.Require // []) | length == 0' >/dev/null; then
  echo "go.mod: the base module requires nothing, but it has a require:"
  go mod edit -json | jq -r '.Require[] | "  \(.Path) \(.Version)"'
  exit 1
fi
for mod in $GO_MODULES; do
  echo "check: $mod"
  cd "$MISE_PROJECT_ROOT/$mod"
  go build ./...
  go vet ./...
  go vet -tags integration ./...
  unformatted=$(gofmt -l .)
  if [ -n "$unformatted" ]; then echo "gofmt: unformatted files:"; echo "$unformatted"; exit 1; fi
  go fix -diff ./...
  go fix -tags integration -diff ./...
  go mod tidy -diff
  go test -race ./...
  golangci-lint run ./...
  golangci-lint run --build-tags integration ./...
done
'''

# The integration tier runs the integration-tagged tests against the endpoints the AI_*_BASE_URL
# variables name, which pass through from the caller's environment: AI_AGENT_BASE_URL,
# AI_VISION_BASE_URL, AI_AUDIO_BASE_URL, AI_EMBEDDING_BASE_URL, and AI_TRANSCRIPTION_BASE_URL,
# each an API root including /v1. Each role may add its credentials, also passed through:
# AI_<ROLE>_TOKEN, the bearer token, and AI_<ROLE>_HEADER, one or more "Name: value" lines
# separated by newlines, such as AI_AGENT_TOKEN and AI_AGENT_HEADER; unset, none is sent, and no
# failing scenario prints a token or header value. Each role may also name its model in
# AI_<ROLE>_MODEL, such as AI_AGENT_MODEL, for an endpoint that lists more than one; unset, a
# scenario sends to the one model the endpoint lists. Each role may also give its deployment's
# profile in AI_<ROLE>_PROFILE, the shape infer's --profile takes: a JSON object keyed by
# completions, messages, or responses, each member that go-ai format's Options under their json
# names, decoded strictly, a malformed one failing the role's scenarios naming the variable. Unset,
# or a member absent, is the format's zero Options, its spec. go-ai's tier builds each format with
# the role's member, and infer's passes the profile as INFER_PROFILE. A scenario whose request the
# profile refuses before sending, a declared gap, skips naming it; a refusal of the spec's own
# still fails. For example, the agent row's vLLM 0.34.0 (gpt-oss-120b), each field backed by a
# recording in format/<fmt>/testdata/vllm-0.34.0, whose README tells it:
#   AI_AGENT_PROFILE='{"completions":{"refused_efforts":["none","minimal","xhigh","max"],"no_allowed_tools":true},"responses":{"refused_efforts":["none","xhigh"],"no_allowed_tools":true,"resend_reasoning_text":true},"messages":{"refused_efforts":["none","xhigh","max"]}}'
#   completions refused_efforts: effort_none.json, effort_minimal.json, effort_xhigh.json, effort_max.json
#   completions no_allowed_tools: allowed_tools.json
#   responses refused_efforts: effort_none.json, effort_xhigh.json
#   responses no_allowed_tools: allowed_tools.json
#   responses resend_reasoning_text: reasoning_text.json
#   messages refused_efforts: effort_none.json, effort_xhigh.json, effort_max.json
# On that row the Open Responses round trips, TestFunctionCallRoundTrip, TestReasoningRoundTrip,
# and TestStreamReasoningRoundTrip through responses, pass under this profile and under the zero
# profile alike (vLLM 0.34.0, 2026-11-18). Nothing reads this example; go-ai ships no preset. Each tier's
# package doc, integration/doc.go and tools/infer/integration/doc.go, tells it in full. A
# scenario whose variable is unset skips, so with none set the run skips whole and passes. It runs
# verbose, so the log lists each scenario passed or skipped, with the variable a skip wants. It
# never starts a server, and no CI job runs it.
[tasks.integration]
description = "Run the integration tier against the endpoints the AI_*_BASE_URL variables name"
run = '''
set -eu
export GOWORK=off
for mod in $GO_MODULES; do
  cd "$MISE_PROJECT_ROOT/$mod"
  # Only a module with an integration tier has the package to run.
  [ -d integration ] || continue
  echo "integration: $mod"
  go test -race -tags integration -count=1 -v ./integration/...
done
'''

[tasks.currency]
description = "Report every requirement, Go version, tool, and action pin behind its latest; writes nothing"
run = "scripts/currency.sh"

[tasks.upgrade]
description = "Upgrade every module's go directive and direct requirements and the local mise tools to their latest, rewriting go.mod and mise.toml"
run = '''
set -eu
export GOWORK=off
# The go directive follows the current Go minor, with no toolchain line.
go_minor=$(mise latest go | cut -d. -f1,2)
for mod in $GO_MODULES; do
  echo "upgrade: $mod"
  cd "$MISE_PROJECT_ROOT/$mod"
  go mod edit -go="$go_minor" -toolchain=none
  # A module with no direct requirement, as the base module is, gets nothing.
  direct=$(go mod edit -json | jq -r '.Require[]? | select(.Indirect | not) | .Path')
  [ -z "$direct" ] || go get $(printf '%s@latest ' $direct)
  go mod tidy
done
cd "$MISE_PROJECT_ROOT"
# --no-global writes this mise.toml alone, never the global config; it is what go-storage's
# --local, now a deprecated alias, means.
mise upgrade --bump --no-global
'''
