# See architecture/standards/go-elemental/principles/release-and-ci.md
# See README.md
min_version = "2026.10.4"

[settings]
experimental = true
task.run_auto_install = false

[tools]
"github:standards-lab/claude-plugins" = { version = "0.24.0", version_prefix = "marathon/v" }
"aqua:FiloSottile/age" = "1.3.2"
fnox = "1.50.0"
go = "1.27.4"
golangci-lint = "2.15.0"
jq = "1.8.2"
yq = "4.54.3"

[env]
GO_MODULES = ". tools/infer"

[secrets.fnox]

[tasks.check]
description = "Hold the base module to no requirements, then build, vet, format, fix, tidy, test, and lint every module, then run lint-context, lint-references, and lint-secrets; writes nothing"
run = '''
set -eu
export GOWORK=off
cd "$MISE_PROJECT_ROOT"
if ! go mod edit -json | jq -e '(.Require // []) | length == 0' >/dev/null; then
  echo "go.mod: the base module requires nothing, but it has a require:"
  go mod edit -json | jq -r '.Require[] | "  \(.Path) \(.Version)"'
  exit 1
fi
for mod in $GO_MODULES; do
  echo "check: $mod"
  cd "$MISE_PROJECT_ROOT/$mod"
  go build ./...
  go vet ./...
  go vet -tags integration ./...
  unformatted=$(gofmt -l .)
  if [ -n "$unformatted" ]; then echo "gofmt: unformatted files:"; echo "$unformatted"; exit 1; fi
  go fix -diff ./...
  go fix -tags integration -diff ./...
  go mod tidy -diff
  go test -race ./...
  golangci-lint run ./...
  golangci-lint run --build-tags integration ./...
done
cd "$MISE_PROJECT_ROOT"
fail=0
for lint in lint-context lint-references; do
  if ! command -v "$lint" >/dev/null; then
    echo "FAIL: $lint is not on PATH; run mise install" >&2
    fail=1
  elif ! "$lint"; then
    fail=1
  fi
done
scripts/lint-secrets.sh || fail=1
exit "$fail"
'''

# See README.md
# See integration/doc.go
[tasks.integration]
description = "Run the integration tier against the endpoints the AI_*_BASE_URL variables name, giving AI_GATEWAY_TOKEN to each role whose AI_<ROLE>_TOKEN is unset"
secrets = ["AI_GATEWAY_TOKEN"]
run = '''
set -eu
export GOWORK=off
if [ -n "${AI_GATEWAY_TOKEN-}" ]; then
  for role in AGENT VISION AUDIO EMBEDDING TRANSCRIPTION; do
    eval "base=\${AI_${role}_BASE_URL-} token=\${AI_${role}_TOKEN-}"
    if [ -n "$base" ] && [ -z "$token" ]; then
      export "AI_${role}_TOKEN=$AI_GATEWAY_TOKEN"
    fi
  done
  unset base token
fi
for mod in $GO_MODULES; do
  cd "$MISE_PROJECT_ROOT/$mod"
  [ -d integration ] || continue
  echo "integration: $mod"
  go test -race -tags integration -count=1 -v ./integration/...
done
'''

[tasks.currency]
description = "Report every requirement, Go version, tool, and action pin behind its latest; writes nothing"
run = "scripts/currency.sh"

[tasks.upgrade]
description = "Upgrade every module's go directive to the current Go minor, with no toolchain line, and its direct requirements and the local mise tools to their latest, rewriting go.mod and mise.toml"
run = '''
set -eu
export GOWORK=off
go_minor=$(mise latest go | cut -d. -f1,2)
for mod in $GO_MODULES; do
  echo "upgrade: $mod"
  cd "$MISE_PROJECT_ROOT/$mod"
  go mod edit -go="$go_minor" -toolchain=none
  direct=$(go mod edit -json | jq -r '.Require[]? | select(.Indirect | not) | .Path')
  [ -z "$direct" ] || go get $(printf '%s@latest ' $direct)
  go mod tidy
done
cd "$MISE_PROJECT_ROOT"
mise upgrade --bump --no-global
'''
